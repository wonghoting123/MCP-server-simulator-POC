version: '3.8'

services:
  solace:
    image: solace/solace-pubsub-standard:latest
    container_name: solace-broker
    ports:
      - "55555:55555"  # SMF
      - "8080:8080"    # Web UI
      - "1883:1883"    # MQTT
      - "8000:8000"    # REST
      - "5672:5672"    # AMQP
      - "9000:9000"    # REST over TLS
    environment:
      - username_admin_globalaccesslevel=admin
      - username_admin_password=admin
    shm_size: 2gb
    ulimits:
      core: -1
      nofile:
        soft: 2448
        hard: 42192
    volumes:
      - solace-data:/var/lib/solace

volumes:
  solace-data:
    driver: local
